services:
  postgres:
    image: postgres:16-alpine
    container_name: taiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taiki
      POSTGRES_PASSWORD: taiki
      POSTGRES_DB: taiki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiki -d taiki"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
    driver: local
