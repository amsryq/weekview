name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets['CLOUDFLARE_ACCOUNT_ID'] }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets['CLOUDFLARE_PAGES_PROJECT'] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v4
        with:
            # See here for caching with `yarn`, `bun` or other package managers https://github.com/actions/cache/blob/main/examples.md or you can leverage caching with actions/setup-node https://github.com/actions/setup-node
            path: |
                ~/.bun/install/cache
                ${{ github.workspace }}/.next/cache
            # Generate a new cache whenever packages or source files change.
            key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
            # If source files changed but packages didn't, rebuild from a prior cache.
            restore-keys: |
                ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-


      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
            echo "NEXT_PUBLIC_APP_URL=${{ vars['NEXT_PUBLIC_APP_URL'] }}" >> .env.production
            echo "NEXT_PUBLIC_BACKEND_URL=${{ vars['NEXT_PUBLIC_BACKEND_URL'] }}" >> .env.production
            echo "NEXT_PUBLIC_BACKEND_INDEX_URL=${{ vars['NEXT_PUBLIC_BACKEND_INDEX_URL'] }}" >> .env.production
            bun run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main
